services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - "./data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - TZ=Europe/Budapest
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 8 * * *       # check daily at 8:00 AM
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true  # monitor ALL containers
      # --- Email notification ---
      - DIUN_NOTIF_MAIL_HOST=smtp.gmail.com
      - DIUN_NOTIF_MAIL_PORT=587
      - DIUN_NOTIF_MAIL_SSL=false
      - DIUN_NOTIF_MAIL_USERNAME=mvencel14@gmail.com
      - DIUN_NOTIF_MAIL_PASSWORD=trbr zmni wxnu xlqv
      - DIUN_NOTIF_MAIL_FROM=mvencel14@gmail.com
      - DIUN_NOTIF_MAIL_TO=mvencel14@gmail.com
    restart: unless-stopped
